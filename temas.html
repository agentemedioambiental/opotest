<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>OpoTest - Temas</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { darkMode: 'class' }</script>
  <link rel="stylesheet" href="./css/style.css">
  <style>
    #temaDialog { width: min(32rem, calc(100% - 2rem)); max-height: calc(100dvh - 2rem); overflow: hidden; }
    #temaDialog::backdrop { background: rgb(0 0 0 / .5); }
    #temaForm { display: flex; flex-direction: column; gap: 1rem; max-height: calc(100dvh - 2rem - 2px); }
    #temaForm[aria-busy="true"] { cursor: progress; }
  </style>
</head>
<body class="bg-gray-50 dark:bg-gray-900 text-gray-900 dark:text-gray-100">

  <header id="appHeader"></header>

  <main class="max-w-2xl mx-auto px-4 pt-4 pb-24 space-y-4">
    <div class="flex items-center justify-between gap-3">
      <h2 class="text-base font-semibold">Temario</h2>
      <button id="btnNuevoTema" type="button" onclick="abrirEditorTema()" disabled
        class="inline-flex items-center gap-2 min-h-[40px] px-3 rounded-lg bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-semibold disabled:opacity-40">
        <i data-lucide="plus" class="w-4 h-4" aria-hidden="true"></i>Nuevo tema
      </button>
    </div>
    <div class="relative">
      <span class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400">Buscar</span>
      <input id="searchInput" type="search" placeholder="Buscar tema o codigo..."
        class="w-full pl-20 pr-4 py-2.5 bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
    </div>

    <div id="gruposFiltro" class="flex gap-2 overflow-x-auto pb-1 -mx-4 px-4"></div>
    <p id="resumen" class="text-xs text-gray-400 px-1">Temas v20261018-1</p>

    <div id="spinner" class="flex justify-center py-16"><div class="spinner"></div></div>
    <div id="lista" class="hidden space-y-5"></div>

    <div id="empty" class="hidden text-center py-12">
      <p class="font-medium text-gray-600 dark:text-gray-400">No hay temas</p>
      <p class="text-sm text-gray-400 mt-1" id="emptyMsg">Todavia no hay temas en el temario.</p>
      <button type="button" id="emptyCreate" onclick="abrirEditorTema()" class="mt-4 px-3 min-h-[40px] rounded-lg bg-indigo-600 text-white text-sm font-semibold">Crear tema</button>
      <a href="./importar.html" id="emptyLink" class="inline-block mt-4 text-indigo-600 dark:text-indigo-400 text-sm font-medium">Ir a Importar</a>
    </div>
  </main>

  <dialog id="temaDialog" aria-labelledby="temaDialogTitle" class="rounded-lg border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800 text-gray-900 dark:text-gray-100 p-0 shadow-xl">
    <form id="temaForm" onsubmit="guardarTema(event)" class="p-5">
      <div class="shrink-0 flex items-center justify-between gap-3">
        <h2 id="temaDialogTitle" class="text-lg font-semibold">Nuevo tema</h2>
        <button type="button" onclick="cerrarEditorTema()" title="Cerrar" aria-label="Cerrar" class="w-10 h-10 shrink-0 inline-flex items-center justify-center rounded-lg hover:bg-gray-100 dark:hover:bg-gray-700">
          <i data-lucide="x" class="w-5 h-5" aria-hidden="true"></i>
        </button>
      </div>
      <div id="temaFields" class="min-h-0 overflow-y-auto space-y-4">
      <div>
        <label for="temaGrupo" class="block text-sm font-medium mb-1">Grupo</label>
        <input id="temaGrupo" list="gruposDisponibles" required maxlength="150" autocomplete="off"
          class="w-full px-3 py-2 rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-900">
        <datalist id="gruposDisponibles"></datalist>
      </div>
      <div>
        <label for="temaCodigo" class="block text-sm font-medium mb-1">Codigo</label>
        <input id="temaCodigo" required maxlength="64" pattern="\S+" autocomplete="off" aria-describedby="temaCodigoNota"
          class="w-full px-3 py-2 rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-900 read-only:bg-gray-100 dark:read-only:bg-gray-700">
        <p id="temaCodigoNota" class="mt-1 text-xs text-gray-500 dark:text-gray-400">Codigo unico, sin espacios, como el del archivo de preguntas.</p>
      </div>
      <div>
        <label for="temaNombre" class="block text-sm font-medium mb-1">Nombre del tema</label>
        <textarea id="temaNombre" required rows="4" class="w-full px-3 py-2 rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-900 resize-y"></textarea>
      </div>
      <p id="temaFormError" role="alert" class="hidden text-sm text-red-600 dark:text-red-400"></p>
      <div id="temaDeleteConfirm" class="hidden border-t border-gray-200 dark:border-gray-700 pt-4 space-y-2">
        <label for="temaDeleteCode" id="temaDeleteLabel" class="block text-sm font-medium"></label>
        <input id="temaDeleteCode" autocomplete="off" class="w-full px-3 py-2 rounded-lg border border-red-300 dark:border-red-800 bg-white dark:bg-gray-900">
        <button type="button" onclick="eliminarTema()" class="min-h-[40px] px-3 rounded-lg bg-red-600 hover:bg-red-700 text-white text-sm font-semibold">Confirmar eliminacion del tema</button>
      </div>
      </div>
      <div class="shrink-0 flex flex-wrap items-center justify-end gap-2 border-t border-gray-200 dark:border-gray-700 pt-4">
        <button id="btnEliminarTema" type="button" onclick="mostrarConfirmacionEliminarTema()" class="hidden mr-auto inline-flex items-center gap-2 min-h-[40px] px-2 rounded-lg text-red-600 dark:text-red-400 hover:bg-red-50 dark:hover:bg-red-900/20 text-sm">
          <i data-lucide="trash-2" class="w-4 h-4" aria-hidden="true"></i>Eliminar tema
        </button>
        <button type="button" onclick="cerrarEditorTema()" class="min-h-[40px] px-3 rounded-lg border border-gray-300 dark:border-gray-600 text-sm">Cancelar</button>
        <button id="btnGuardarTema" type="submit" class="min-h-[40px] px-3 rounded-lg bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-semibold">Guardar</button>
      </div>
    </form>
  </dialog>

  <nav id="bottomNav"></nav>

  <script src="https://cdn.jsdelivr.net/npm/lucide@0.468.0/dist/umd/lucide.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="./js/config.js?v=20260508-1"></script>
  <script src="./js/auth.js?v=20260508-1"></script>
  <script src="./js/utils.js?v=20260508-1"></script>
  <script src="./js/layout.js?v=20261018-1"></script>
  <script>
    let todosLosTemas = []
    let grupoActivo = ''
    let eliminandoTemaId = null
    let temaEditandoId = null
    let guardandoTema = false
    let versionCarga = 0

    ;(async () => {
      const watchdog = setTimeout(() => {
        mostrarError('La pagina esta tardando demasiado. Recarga o vuelve a iniciar sesion.')
      }, 15000)

      try {
        const session = await requireAuth()
        if (!session) return
        initLayout('temas', 'Temas', './dashboard.html')
        window.lucide?.createIcons()
        document.getElementById('temaDialog').addEventListener('cancel', event => {
          if (guardandoTema) event.preventDefault()
        })
        document.getElementById('searchInput').addEventListener('input', renderLista)
        await cargarTemas()
      } catch (e) {
        mostrarError(e.message || 'No se pudo cargar temas.')
      } finally {
        clearTimeout(watchdog)
        document.getElementById('spinner').classList.add('hidden')
      }
    })()

    async function cargarTemas() {
      const version = ++versionCarga
      const { data, error } = await conTiempoLimite(
        db.from('temas').select('id,grupo,codigo,tema').order('grupo').order('codigo'),
        10000,
        'La carga de temas ha tardado demasiado'
      )
      if (error) throw error

      todosLosTemas = (data || []).map(t => ({
        ...t,
        grupo: String(t.grupo || 'Sin grupo'),
        codigo: String(t.codigo || ''),
        tema: String(t.tema || ''),
        preguntas_count: null,
      }))

      document.getElementById('spinner').classList.add('hidden')
      document.getElementById('btnNuevoTema').disabled = false
      if (grupoActivo && !todosLosTemas.some(t => t.grupo === grupoActivo)) grupoActivo = ''
      renderGrupos()
      renderLista()
      cargarRecuentos(version)
    }

    async function cargarRecuentos(version) {
      const filtros = { activa: true, eliminada: false }
      const resultados = await Promise.allSettled([
        contarPreguntasPorTema(todosLosTemas.map(t => t.id), filtros),
        contarPreguntasPorCodigo(todosLosTemas.map(t => t.codigo), filtros),
      ])
      const porId = resultados[0].status === 'fulfilled' ? resultados[0].value : {}
      const porCodigo = resultados[1].status === 'fulfilled' ? resultados[1].value : {}
      if (version !== versionCarga) return
      const disponible = resultados.some(r => r.status === 'fulfilled')

      todosLosTemas = todosLosTemas.map(t => ({
        ...t,
        preguntas_count: disponible ? Math.max(porId[t.id] || 0, porCodigo[t.codigo] || 0) : null,
      }))
      renderLista()
    }

    function renderGrupos() {
      const cont = document.getElementById('gruposFiltro')
      cont.innerHTML = ''
      const grupos = ['', ...new Set(todosLosTemas.map(t => t.grupo))]
      grupos.forEach(g => {
        const btn = document.createElement('button')
        btn.type = 'button'
        btn.textContent = g || 'Todos'
        btn.dataset.grupo = g
        btn.className = claseGrupo(g === grupoActivo)
        btn.addEventListener('click', () => setGrupo(g))
        cont.appendChild(btn)
      })
    }

    function claseGrupo(activo) {
      return `shrink-0 px-3 py-1.5 rounded-full text-sm font-medium transition-colors ${
        activo ? 'bg-indigo-600 text-white' : 'bg-gray-100 dark:bg-gray-800 text-gray-600 dark:text-gray-300'
      }`
    }

    function setGrupo(g) {
      grupoActivo = g
      document.querySelectorAll('#gruposFiltro button').forEach(btn => {
        btn.className = claseGrupo(btn.dataset.grupo === grupoActivo)
      })
      renderLista()
    }

    function renderLista() {
      const busqueda = document.getElementById('searchInput').value.trim().toLowerCase()
      const filtrados = todosLosTemas.filter(t => {
        const okGrupo = !grupoActivo || t.grupo === grupoActivo
        const okSearch = !busqueda || t.tema.toLowerCase().includes(busqueda) || t.codigo.toLowerCase().includes(busqueda)
        return okGrupo && okSearch
      })

      const lista = document.getElementById('lista')
      const empty = document.getElementById('empty')
      const resumen = document.getElementById('resumen')
      const pendientes = filtrados.some(t => t.preguntas_count === null)
      const total = filtrados.reduce((s, t) => s + (t.preguntas_count || 0), 0)
      resumen.textContent = `Temas v20261018-1 - ${filtrados.length} temas - ${pendientes ? 'calculando preguntas' : total.toLocaleString('es-ES') + ' preguntas'}`

      if (!filtrados.length) {
        lista.classList.add('hidden')
        empty.classList.remove('hidden')
        document.getElementById('emptyMsg').textContent = todosLosTemas.length ? 'Sin resultados para esa busqueda.' : 'Todavia no hay temas en el temario.'
        document.getElementById('emptyCreate').classList.toggle('hidden', todosLosTemas.length > 0)
        document.getElementById('emptyLink').style.display = todosLosTemas.length ? 'none' : ''
        return
      }

      empty.classList.add('hidden')
      lista.classList.remove('hidden')
      lista.innerHTML = ''

      const porGrupo = filtrados.reduce((acc, t) => {
        ;(acc[t.grupo] = acc[t.grupo] || []).push(t)
        return acc
      }, Object.create(null))

      Object.entries(porGrupo).forEach(([grupo, temas]) => {
        const bloque = document.createElement('div')
        const h = document.createElement('h2')
        h.className = 'text-xs font-semibold text-gray-500 dark:text-gray-400 uppercase tracking-wide mb-2 px-1'
        h.textContent = grupo
        bloque.appendChild(h)

        const cards = document.createElement('div')
        cards.className = 'space-y-2'
        temas.forEach(t => cards.appendChild(crearCardTema(t)))
        bloque.appendChild(cards)
        lista.appendChild(bloque)
      })
      window.lucide?.createIcons()
    }

    function crearCardTema(t) {
      const card = document.createElement('div')
      card.className = 'bg-white dark:bg-gray-800 rounded-xl border border-gray-100 dark:border-gray-700 px-4 py-3'

      const top = document.createElement('div')
      top.className = 'flex items-start gap-3'

      const controls = document.createElement('div')
      controls.className = 'shrink-0 w-[86px] flex flex-col items-center gap-1.5'

      const code = document.createElement('span')
      code.className = 'w-full min-h-[24px] truncate text-center text-[10px] font-medium bg-indigo-100 dark:bg-indigo-900/40 text-indigo-700 dark:text-indigo-300 px-1.5 py-1 rounded-lg'
      code.textContent = t.codigo
      code.title = t.codigo

      const btnTest = document.createElement('a')
      btnTest.href = `./test.html?v=20260508-2&temas=${encodeURIComponent(t.id)}&grupo=${encodeURIComponent(t.grupo)}`
      btnTest.className = 'w-full min-h-[30px] px-2 rounded-lg bg-indigo-50 dark:bg-indigo-900/25 text-indigo-700 dark:text-indigo-300 hover:bg-indigo-100 dark:hover:bg-indigo-900/40 text-xs font-semibold flex items-center justify-center'
      btnTest.textContent = 'Test'

      const btnDelete = document.createElement('button')
      btnDelete.type = 'button'
      btnDelete.disabled = !t.preguntas_count || eliminandoTemaId === t.id
      btnDelete.className = `w-full min-h-[30px] px-2 rounded-lg text-xs font-semibold ${
        btnDelete.disabled
          ? 'text-gray-400 dark:text-gray-500 bg-gray-50 dark:bg-gray-700/40'
          : 'text-red-500 dark:text-red-300 bg-red-50 dark:bg-red-900/15 hover:bg-red-100 dark:hover:bg-red-900/30'
      }`
      btnDelete.textContent = eliminandoTemaId === t.id ? '...' : 'Eliminar'
      btnDelete.title = 'Eliminar preguntas del tema ' + t.codigo
      btnDelete.setAttribute('aria-label', btnDelete.title)
      btnDelete.addEventListener('click', () => eliminarPreguntasTema(t))

      const countWrap = document.createElement('div')
      countWrap.className = 'w-full pt-1 text-center'
      const count = document.createElement('p')
      count.className = 'text-base font-bold text-gray-700 dark:text-gray-300 leading-none'
      count.textContent = t.preguntas_count === null ? '...' : (t.preguntas_count || 0).toLocaleString('es-ES')
      const label = document.createElement('p')
      label.className = 'text-[10px] text-gray-400'
      label.textContent = 'pregs.'
      countWrap.appendChild(count)
      countWrap.appendChild(label)

      controls.appendChild(code)
      controls.appendChild(btnTest)
      controls.appendChild(btnDelete)
      controls.appendChild(countWrap)

      const textWrap = document.createElement('div')
      textWrap.className = 'flex-1 min-w-0 flex items-start gap-1'
      const text = document.createElement('p')
      text.className = 'flex-1 min-w-0 break-words text-sm font-medium text-gray-900 dark:text-white leading-snug pt-0.5'
      text.textContent = t.tema
      const edit = document.createElement('button')
      edit.type = 'button'
      edit.className = 'shrink-0 w-9 h-9 flex items-center justify-center rounded-lg text-gray-500 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-gray-700 focus-visible:outline-indigo-500'
      edit.title = 'Editar tema ' + t.codigo
      edit.setAttribute('aria-label', edit.title)
      edit.innerHTML = '<i data-lucide="pencil" class="w-4 h-4" aria-hidden="true"></i>'
      edit.addEventListener('click', () => abrirEditorTema(t))
      textWrap.appendChild(text)
      textWrap.appendChild(edit)

      top.appendChild(controls)
      top.appendChild(textWrap)
      card.appendChild(top)
      return card
    }

    function abrirEditorTema(t = null) {
      temaEditandoId = t?.id || null
      const form = document.getElementById('temaForm')
      form.reset()
      document.getElementById('temaDialogTitle').textContent = t ? 'Editar tema' : 'Nuevo tema'
      document.getElementById('temaGrupo').value = t?.grupo || grupoActivo
      document.getElementById('temaCodigo').value = t?.codigo || ''
      document.getElementById('temaCodigo').readOnly = !!t
      document.getElementById('temaCodigoNota').textContent = t
        ? 'El codigo se conserva para mantener la relacion con las preguntas.'
        : 'Codigo unico, sin espacios, como el del archivo de preguntas.'
      document.getElementById('temaNombre').value = t?.tema || ''
      document.getElementById('temaFormError').classList.add('hidden')
      document.getElementById('temaDeleteConfirm').classList.add('hidden')
      document.getElementById('btnGuardarTema').classList.remove('hidden')
      document.getElementById('btnEliminarTema').classList.toggle('hidden', !t)
      const grupos = document.getElementById('gruposDisponibles')
      grupos.replaceChildren()
      ;[...new Set(todosLosTemas.map(tema => tema.grupo))].sort().forEach(grupo => {
        const option = document.createElement('option')
        option.value = grupo
        grupos.appendChild(option)
      })
      document.getElementById('temaDialog').showModal()
      document.getElementById('temaGrupo').focus()
    }

    function cerrarEditorTema() {
      if (!guardandoTema) document.getElementById('temaDialog').close()
    }

    function estadoEditorTema(ocupado) {
      guardandoTema = ocupado
      const form = document.getElementById('temaForm')
      form.setAttribute('aria-busy', String(ocupado))
      form.querySelectorAll('button, input, textarea').forEach(el => { el.disabled = ocupado })
      document.getElementById('btnGuardarTema').textContent = ocupado ? 'Guardando...' : 'Guardar'
    }

    function errorEditorTema(error) {
      const el = document.getElementById('temaFormError')
      el.textContent = error.code === '23505' ? 'Ya existe un tema con ese codigo.' : (error.message || String(error))
      el.classList.remove('hidden')
      el.scrollIntoView({ block: 'nearest' })
    }

    async function guardarTema(event) {
      event.preventDefault()
      if (guardandoTema) return
      if (!document.getElementById('temaDeleteConfirm').classList.contains('hidden')) {
        await eliminarTema()
        return
      }
      const grupo = document.getElementById('temaGrupo').value.trim()
      const codigo = document.getElementById('temaCodigo').value.trim().toUpperCase()
      const tema = document.getElementById('temaNombre').value.trim()
      if (!grupo || !codigo || !tema || /\s/.test(codigo)) {
        errorEditorTema(new Error('Completa el grupo, un codigo sin espacios y el nombre del tema.'))
        return
      }
      if (todosLosTemas.some(t => t.id !== temaEditandoId && t.codigo.toUpperCase() === codigo)) {
        errorEditorTema({ code: '23505' })
        return
      }

      const editando = !!temaEditandoId
      estadoEditorTema(true)
      document.getElementById('temaFormError').classList.add('hidden')
      try {
        const query = editando
          ? db.from('temas').update({ grupo, tema }).eq('id', temaEditandoId)
          : db.from('temas').insert({ grupo, codigo, tema })
        const { data, error } = await query.select('id,grupo,codigo,tema').single()
        if (error) throw error
        if (!data) throw new Error('No se pudo guardar el tema. Comprueba tu sesion y los permisos.')
        ++versionCarga
        const anterior = todosLosTemas.find(t => t.id === data.id)
        todosLosTemas = todosLosTemas.filter(t => t.id !== data.id)
        todosLosTemas.push({ ...data, preguntas_count: anterior?.preguntas_count ?? null })
        todosLosTemas.sort((a, b) => a.grupo.localeCompare(b.grupo, 'es') || a.codigo.localeCompare(b.codigo, 'es', { numeric: true }))
        grupoActivo = grupo
        document.getElementById('searchInput').value = ''
        renderGrupos()
        renderLista()
        document.getElementById('temaDialog').close()
        toast(editando ? 'Tema actualizado.' : 'Tema creado.', 'success')
        cargarRecuentos(versionCarga)
      } catch (error) {
        errorEditorTema(error)
      } finally {
        estadoEditorTema(false)
      }
    }

    function mostrarConfirmacionEliminarTema() {
      const t = todosLosTemas.find(tema => tema.id === temaEditandoId)
      if (!t || guardandoTema) return
      document.getElementById('temaDeleteLabel').textContent = `Escribe ${t.codigo} para eliminar este tema vacio.`
      document.getElementById('temaDeleteConfirm').classList.remove('hidden')
      document.getElementById('btnGuardarTema').classList.add('hidden')
      document.getElementById('temaDeleteCode').focus()
    }

    async function eliminarTema() {
      const t = todosLosTemas.find(tema => tema.id === temaEditandoId)
      if (!t || guardandoTema) return
      if (document.getElementById('temaDeleteCode').value.trim() !== t.codigo) {
        errorEditorTema(new Error('Escribe el codigo exacto del tema para confirmar.'))
        return
      }
      estadoEditorTema(true)
      document.getElementById('temaFormError').classList.add('hidden')
      try {
        const { data, error } = await db.rpc('eliminar_tema_vacio', { p_tema_id: t.id })
        if (error) {
          if (error.code === 'PGRST202') throw new Error('Falta activar la gestion de temas en Supabase. Ejecuta supabase/gestion_temas.sql en el SQL Editor del proyecto.')
          throw error
        }
        if (data !== t.id) throw new Error('No se pudo confirmar la eliminacion del tema.')
        ++versionCarga
        todosLosTemas = todosLosTemas.filter(tema => tema.id !== t.id)
        if (!todosLosTemas.some(tema => tema.grupo === grupoActivo)) grupoActivo = ''
        renderGrupos()
        renderLista()
        document.getElementById('temaDialog').close()
        toast('Tema eliminado.', 'success')
        cargarRecuentos(versionCarga)
      } catch (error) {
        errorEditorTema(error)
      } finally {
        estadoEditorTema(false)
      }
    }

    async function eliminarPreguntasTema(t) {
      const total = t.preguntas_count || 0
      if (!total || eliminandoTemaId) return

      const texto = window.prompt(`Vas a marcar como eliminadas ${total} preguntas disponibles del tema ${t.codigo}.\n\nEscribe ${t.codigo} para confirmar.`)
      if (texto !== t.codigo) return

      eliminandoTemaId = t.id
      renderLista()

      try {
        const { error: e1 } = await db.from('preguntas')
          .update({ eliminada: true })
          .eq('tema_id', t.id)
          .eq('activa', true)
          .eq('eliminada', false)
        if (e1) throw e1

        const { error: e2 } = await db.from('preguntas')
          .update({ eliminada: true })
          .eq('codigo_tema', t.codigo)
          .eq('activa', true)
          .eq('eliminada', false)
        if (e2) throw e2

        todosLosTemas = todosLosTemas.map(tema => tema.id === t.id ? { ...tema, preguntas_count: 0 } : tema)
        toast(`Preguntas del tema ${t.codigo} eliminadas.`, 'success', 3500)
      } catch (e) {
        toast('No se pudieron eliminar: ' + (e.message || e), 'error', 6000)
      } finally {
        eliminandoTemaId = null
        renderLista()
      }
    }

    function mostrarError(msg) {
      document.getElementById('spinner').classList.add('hidden')
      document.getElementById('lista').classList.add('hidden')
      document.getElementById('empty').classList.remove('hidden')
      document.getElementById('emptyMsg').textContent = msg
      document.getElementById('emptyCreate').classList.add('hidden')
      document.getElementById('emptyLink').textContent = 'Volver al inicio'
      document.getElementById('emptyLink').href = './index.html?v=20260506-10'
      document.getElementById('emptyLink').style.display = ''
    }
  </script>
